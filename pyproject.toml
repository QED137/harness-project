[project]
name = "tsagent"
version = "0.1.0"
description = "An agent that answers quantitative questions about weather time series by writing and running sandboxed Python, with an evaluation harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=23.0.1",
    "openai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: needs a running Docker daemon and the tsagent-sandbox image",
    "slow: takes more than a few seconds",
    "live: calls the real OpenAI API (costs money); skipped unless run with: pytest --live",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, S: security, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S603", "S607",   # subprocess calls are the whole point of the sandbox host
    "S102",           # exec is the whole point of the runner
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]   # assert and /tmp paths are fine in tests

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# pandas' .loc/.resample return wide unions, so the ground-truth expressions in
# questions.py produce hundreds of false positives. The functions are covered by
# tests that run every one of them on a dataset instead.
[[tool.mypy.overrides]]
module = "tsagent.questions"
disable_error_code = ["union-attr", "operator", "arg-type", "call-overload", "index", "attr-defined"]
